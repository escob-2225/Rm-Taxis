{% extends "base.html" %}

{% block titulo %}
Iniciar Sesión
{% endblock %}

{% block contenido %}

<div class="login-box">

    <h2 class="text-center mb-4">Taxi Manager</h2>

    <form method="POST">

        <div class="mb-3">
            <label class="form-label">Correo</label>
            <input
                type="email"
                name="correo"
                class="form-control"
                placeholder="Ingrese su correo"
                required>
        </div>

        <div class="mb-3">
            <label class="form-label">Contraseña</label>
            <input
                type="password"
                name="password"
                class="form-control"
                placeholder="Ingrese su contraseña"
                required>
        </div>

        <button type="submit" class="btn btn-primary w-100">
            Ingresar
        </button>

    </form>

</div>

{% endblock %}
