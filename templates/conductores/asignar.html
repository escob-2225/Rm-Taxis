{% extends "layout_app.html" %}

{% block titulo %}Asignar conductor — Rm Taxis{% endblock %}

{% block app_content %}
<div class="page-header">
    <div>
        <h1>Asignar conductor</h1>
        <p class="text-muted mb-0">La asignación anterior se cierra automáticamente y queda en el historial</p>
    </div>
</div>

<div class="panel form-panel">
    <form method="POST">
        <div class="row g-3">
            <div class="col-md-6">
                <label class="form-label">Vehículo *</label>
                <select name="vehiculo_id" class="form-select" required>
                    <option value="">Seleccione…</option>
                    {% for v in vehiculos %}
                    <option value="{{ v.id }}" {% if vehiculo_pre == v.id %}selected{% endif %}>
                        {{ v.placa }} — {{ v.marca }} {{ v.modelo }}
                    </option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-md-6">
                <label class="form-label">Conductor *</label>
                <select name="conductor_id" class="form-select" required>
                    <option value="">Seleccione…</option>
                    {% for c in conductores %}
                    <option value="{{ c.id }}">{{ c.nombre }} ({{ c.cedula }})</option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-md-4">
                <label class="form-label">Desde *</label>
                <input type="date" name="fecha_desde" class="form-control" required value="{{ hoy }}">
            </div>
        </div>
        <div class="mt-4">
            <button class="btn btn-primary" type="submit">Asignar</button>
        </div>
    </form>
</div>
{% endblock %}
